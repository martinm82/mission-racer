<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect x="10" y="10" width="836" height="520" rx="36" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="4"/>

  <!-- Top Header Banner -->
  <rect x="10" y="10" width="836" height="88" rx="36" fill="#1e293b"/>
  <rect x="10" y="60" width="836" height="38" fill="#1e293b"/>
  <line x1="10" y1="98" x2="846" y2="98" stroke="url(#purpleGrad)" stroke-width="4"/>

  <text x="50" y="58" font-family="-apple-system, Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">MISSION RACER 3D</text>
  <text x="50" y="84" font-family="-apple-system, Roboto, sans-serif" font-weight="700" font-size="14" fill="#a855f7" letter-spacing="2">OFFICIAL DRIVER RACING LICENSE • FIA FAMILY LEAGUE</text>
  
  <!-- Contactless NFC Wave Logo -->
  <path d="M 770 40 A 18 18 0 0 1 770 70 M 780 34 A 26 26 0 0 1 780 76 M 790 28 A 34 34 0 0 1 790 82" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>

  <!-- Driver Photo / Avatar Box -->
  <rect x="50" y="130" width="180" height="230" rx="20" fill="#111827" stroke="#a855f7" stroke-width="3"/>
  <text x="140" y="240" font-size="70" text-anchor="middle">🏎️</text>
  <text x="140" y="320" font-family="sans-serif" font-weight="800" font-size="16" fill="#a855f7" text-anchor="middle">PRO DRIFTER</text>

  <!-- Driver Details -->
  <text x="260" y="155" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">CALLSIGN / DRIVER NAME</text>
  <text x="260" y="200" font-family="sans-serif" font-size="42" font-weight="900" fill="#ffffff">THUNDER 10</text>

  <text x="260" y="245" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">LICENSE CODE</text>
  <text x="260" y="275" font-family="sans-serif" font-size="22" font-weight="800" fill="#a855f7">MR-10-PRO</text>

  <text x="520" y="245" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">AGE CLASS</text>
  <text x="520" y="275" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">AGE 10 • CLASS S</text>

  <text x="260" y="325" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">SIGNATURE CAR</text>
  <text x="260" y="355" font-family="sans-serif" font-size="20" font-weight="800" fill="#38bdf8">APEX GT / TWIN TURBO</text>

  <text x="520" y="325" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">PIT STOP STATUS</text>
  <text x="520" y="355" font-family="sans-serif" font-size="20" font-weight="800" fill="url(#goldGrad)">MASTER DRIFTER ★★★</text>

  <!-- Gold Chip Emulation -->
  <rect x="710" y="140" width="70" height="55" rx="10" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2"/>
  <line x1="710" y1="168" x2="780" y2="168" stroke="#78350f" stroke-width="1.5"/>
  <line x1="745" y1="140" x2="745" y2="195" stroke="#78350f" stroke-width="1.5"/>

  <!-- Bottom Barcode & League Watermark -->
  <rect x="50" y="405" width="740" height="85" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <g fill="#f8fafc" transform="translate(70, 420)">
    <rect x="0" y="0" width="6" height="40"/><rect x="10" y="0" width="4" height="40"/><rect x="18" y="0" width="8" height="40"/><rect x="30" y="0" width="3" height="40"/>
    <rect x="38" y="0" width="10" height="40"/><rect x="52" y="0" width="4" height="40"/><rect x="60" y="0" width="8" height="40"/><rect x="72" y="0" width="5" height="40"/>
    <rect x="82" y="0" width="7" height="40"/><rect x="94" y="0" width="3" height="40"/><rect x="102" y="0" width="12" height="40"/><rect x="120" y="0" width="4" height="40"/>
    <rect x="130" y="0" width="8" height="40"/><rect x="142" y="0" width="5" height="40"/><rect x="152" y="0" width="6" height="40"/><rect x="166" y="0" width="4" height="40"/>
    <text x="85" y="54" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">* 04-5A-2B-C1-89-60 *</text>
  </g>

  <text x="760" y="455" font-family="sans-serif" font-weight="900" font-size="20" fill="#a855f7" text-anchor="end">FGP-2026-PRO</text>
  <text x="760" y="475" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748b" text-anchor="end">ISSUED BY DAD • COMMISSIONER OF RACING</text>
</svg>
