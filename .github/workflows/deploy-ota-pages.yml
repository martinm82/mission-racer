name: Deploy Mission Racer 3D Cloud OTA Bundle to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Cloud OTA Bundle & ota-manifest.json
        run: |
          mkdir -p _site/nfc-license/templates
          cp -f tools/mission-control-web/index.html _site/index.html
          cp -f tools/mission-control-web/wan-multiplayer.js _site/wan-multiplayer.js
          cp -f tools/mission-control-web/three.min.js _site/three.min.js
          cp -f tools/mission-control-web/manifest.json _site/manifest.json
          cp -f tools/mission-control-web/icon.svg _site/icon.svg
          cp -f tools/mission-control-web/sw.js _site/sw.js 2>/dev/null || true
          cp -f nfc-license/templates/*.svg _site/nfc-license/templates/ 2>/dev/null || true
          if [ -f build/MissionRacer3D.apk ]; then
            cp -f build/MissionRacer3D.apk _site/MissionRacer3D.apk
          fi
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const sha256 = crypto.createHash("sha256")
              .update(fs.readFileSync("_site/index.html"))
              .update(fs.readFileSync("_site/wan-multiplayer.js"))
              .digest("hex");
            const d = new Date();
            const version = `1.2.${d.getUTCMonth()+1}${String(d.getUTCDate()).padStart(2,"0")}.${String(d.getUTCHours()).padStart(2,"0")}${String(d.getUTCMinutes()).padStart(2,"0")}`;
            fs.writeFileSync("_site/ota-manifest.json", JSON.stringify({
              version,
              buildTimestamp: Math.floor(Date.now() / 1000),
              sha256,
              files: ["index.html", "wan-multiplayer.js"],
              apkUrl: "MissionRacer3D.apk"
            }, null, 2));
          '
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
