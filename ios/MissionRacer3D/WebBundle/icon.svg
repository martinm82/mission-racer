<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111b33"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.6"/>

  <!-- Perspective Speed Grid -->
  <path d="M256 170 L60 490 M256 170 L180 490 M256 170 L332 490 M256 170 L452 490" stroke="#00e5ff" stroke-width="3" opacity="0.25"/>
  <line x1="30" y1="220" x2="482" y2="220" stroke="#ff007f" stroke-width="4" opacity="0.5"/>

  <!-- Neon Underglow -->
  <ellipse cx="256" cy="390" rx="165" ry="28" fill="#00e5ff" opacity="0.65" filter="url(#glow)"/>

  <!-- Rear Tires -->
  <rect x="88" y="310" width="48" height="82" rx="10" fill="#05070c" stroke="#475569" stroke-width="3"/>
  <rect x="376" y="310" width="48" height="82" rx="10" fill="#05070c" stroke="#475569" stroke-width="3"/>

  <!-- Carbon Rear Wing -->
  <rect x="110" y="210" width="292" height="20" rx="8" fill="#1e293b" stroke="#00e5ff" stroke-width="3"/>
  <rect x="170" y="228" width="14" height="32" fill="#0f172a"/>
  <rect x="328" y="228" width="14" height="32" fill="#0f172a"/>

  <!-- Cabin / Rear Glass -->
  <polygon points="165,255 347,255 380,305 132,305" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="185,263 295,263 315,297 165,297" fill="#00e5ff" opacity="0.3"/>

  <!-- Supercar Rear Chassis -->
  <rect x="106" y="295" width="300" height="85" rx="24" fill="url(#carBody)" stroke="#ffffff" stroke-width="3"/>

  <!-- Glowing LED Taillight Bar -->
  <rect x="122" y="316" width="268" height="18" rx="6" fill="#ffeb3b" filter="url(#glow)"/>
  <rect x="122" y="318" width="90" height="14" rx="4" fill="#ffffff"/>
  <rect x="300" y="318" width="90" height="14" rx="4" fill="#ffffff"/>

  <!-- Dual Nitro Exhaust Flames -->
  <polygon points="185,375 205,445 225,375" fill="#00e5ff" filter="url(#glow)"/>
  <polygon points="287,375 307,445 327,375" fill="#00e5ff" filter="url(#glow)"/>
  <polygon points="195,375 205,420 215,375" fill="#ffffff"/>
  <polygon points="297,375 307,420 317,375" fill="#ffffff"/>

  <!-- Title Badge -->
  <text x="256" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="2">MISSION</text>
  <text x="256" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" font-style="italic" fill="#00e5ff" text-anchor="middle" letter-spacing="6">RACER 3D</text>
</svg>
